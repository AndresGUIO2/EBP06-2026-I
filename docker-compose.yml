services:
  db:
    image: postgres:15
    container_name: ebp06_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ebp06}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - ebp06_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ebp06}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ebp06_data:
