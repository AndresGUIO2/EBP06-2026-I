services:
  db:
    image: postgres:15
    container_name: ebp06_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ebp06}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ebp06_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-ebp06}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./apps/backend
    container_name: ebp06_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ebp06}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "8080:8080"

  frontend:
    build: ./apps/frontend
    container_name: ebp06_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  ebp06_data:
