name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]

jobs:
  deploy-frontend:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'develop' ||
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Resolve Vercel environment
        id: vercel-env
        shell: bash
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "pull_args=--environment=production" >> "$GITHUB_OUTPUT"
            echo "deploy_args=--prebuilt --prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "pull_args=--environment=preview --git-branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "deploy_args=--prebuilt" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy frontend to Vercel
        working-directory: apps/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel pull --yes ${{ steps.vercel-env.outputs.pull_args }} --token "$VERCEL_TOKEN"
          pnpm dlx vercel build --token "$VERCEL_TOKEN"
          pnpm dlx vercel deploy ${{ steps.vercel-env.outputs.deploy_args }} --token "$VERCEL_TOKEN"
